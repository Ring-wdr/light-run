plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ringwdr.lightrun'
version = '1.0.0'

android {
  namespace "expo.modules.appupdate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Google Play 인앱 업데이트(https://developer.android.com/guide/playcore/in-app-updates)
  implementation 'com.google.android.play:app-update:2.1.0'
}
